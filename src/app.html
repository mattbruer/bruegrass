<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&display=swap"
			rel="stylesheet"
		/>
		<script>
			/*
			 * Apply the user's saved theme before the page first paints, so a dark
			 * theme doesn't flash light while the app starts. This is a tiny copy of
			 * applyTheme() in src/lib/theme/theme.js (the app re-applies it properly
			 * once it's running); keep the two in step.
			 */
			try {
				const settings = JSON.parse(localStorage.getItem('bruegrass.settings') || '{}');
				const appearance = settings.appearance || {};
				const cssVariableFor = {
					background: '--theme-background',
					text: '--theme-text',
					accent: '--theme-accent',
					depth: '--theme-depth',
					roundness: '--theme-roundness'
				};
				for (const choice in cssVariableFor) {
					if (appearance[choice] !== undefined) {
						document.documentElement.style.setProperty(
							cssVariableFor[choice],
							String(appearance[choice])
						);
					}
				}
			} catch {
				// No saved theme (or no storage): the defaults in tokens.css apply
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
