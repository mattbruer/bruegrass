<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..700&display=swap"
			rel="stylesheet"
		/>
		<script>
			// The theme's colours, saved by applyTheme() in src/lib/theme/theme.js,
			// put back before the first paint so nothing flashes the wrong colour
			try {
				const variables = JSON.parse(localStorage.getItem('bruegrass.firstPaint') || '{}');
				for (const variable in variables) {
					document.documentElement.style.setProperty(variable, variables[variable]);
				}
			} catch {
				// Nothing saved (or no storage): the defaults in tokens.css apply
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
